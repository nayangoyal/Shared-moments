# Continuous deployment for the API: every push to main that changes backend/ runs the unit tests,
# builds the image and deploys it to Cloud Run. Used by the Cloud Build trigger "deploy-backend".

substitutions:
  _REGION: asia-south1
  _SERVICE: shared-moments-api
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/shared-moments-api

steps:
  - id: test
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt pytest && python -m pytest -q tests"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "backend"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=sm-api@${PROJECT_ID}.iam.gserviceaccount.com
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest
      - --allow-unauthenticated
      - --no-cpu-throttling
      - --memory=512Mi
      - --max-instances=3
      - --timeout=120
      - --quiet

images: ["${_IMAGE}:${SHORT_SHA}", "${_IMAGE}:latest"]

options:
  logging: CLOUD_LOGGING_ONLY
