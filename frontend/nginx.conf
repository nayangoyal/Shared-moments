# nginx template: ${API_HOST} is filled in from the environment when the container starts
# (the official nginx image does this for files in /etc/nginx/templates).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # The API is a separate Cloud Run service; proxying keeps everything on one address.
  location /api/ {
    proxy_pass https://${API_HOST};
    proxy_set_header Host ${API_HOST};
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store";
  }

  # Hashed build files never change: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The page itself: always check for a new version
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri $uri/ /index.html;
  }
}
